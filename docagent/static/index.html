<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocAgent 文档工作台</title><style>
:root{font-family:system-ui,"Microsoft Yahei",sans-serif;color:#19332c;background:#f3f1e9}*{box-sizing:border-box}body{margin:0}header{padding:25px 5vw;border-bottom:1px solid #c7cec2;display:flex;justify-content:space-between}header b{letter-spacing:2px}main{max-width:1250px;margin:auto;padding:45px 4vw}h1{font-size:44px;letter-spacing:-2px;margin:10px 0}p{color:#586d60;line-height:1.7}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.card{background:#fffdf6;border:1px solid #cbd0c1;padding:24px;border-radius:12px}textarea{width:100%;height:100px;border:1px solid #b9c3b4;border-radius:7px;padding:14px;font:inherit;background:transparent}button{background:#234c3a;color:white;border:0;padding:12px 20px;border-radius:6px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-family:inherit}small{color:#5e7568}#trace{font-size:13px;max-height:260px;overflow:auto}.source{border-top:1px solid #d9ddcf;padding-top:12px;margin-top:12px}details{font-size:13px}a{color:inherit}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:32px}}
</style><header><b>DOCAGENT / 文档工作台</b><small id="health">正在检查服务</small></header><main><small>LOCAL DOCUMENT INTELLIGENCE</small><h1>带着证据，读懂文档。</h1><p>检索、读取章节与安全计算。每个回答都关联本轮工具返回的来源。</p><div class="grid"><section class="card"><label for="q">你的问题</label><textarea id="q" placeholder="例如：FastAPI 默认监听哪个端口？"></textarea><button id="send">查询文档</button><button id="reset">新会话</button><small id="state"></small><h3>回答</h3><pre id="answer">输入问题后，查看工具执行过程与证据。</pre><h3>工具轨迹</h3><pre id="trace"></pre></section><aside class="card"><h3>本轮证据</h3><p>引用编号有效不等于事实已经人工核验。请展开片段核对原文。</p><div id="sources"></div></aside></div><p><small>本机单用户演示 · 摘要用于理解上下文 · 工具事件实时推送，回答经引用校验后分段返回</small></p></main><script>
const $=id=>document.getElementById(id);let session=crypto.randomUUID();$('reset').onclick=()=>{session=crypto.randomUUID();$('answer').textContent='已开始新会话';$('sources').replaceChildren();$('trace').textContent=''};
fetch('/health').then(r=>r.json()).then(j=>$('health').textContent=`${j.chunks} 个片段 / ${j.retrieval_mode} / ${j.llm_configured?'模型已配置':'请填写 .env 密钥'}`).catch(()=>$('health').textContent='服务不可用');
function handle(type,data){if(type==='status')$('state').textContent=data.message;if(type==='tool')$('trace').textContent+=`${data.phase} ${data.name} ${JSON.stringify(data.arguments)} ${data.elapsed_ms??''}\n`;if(type==='token')$('answer').textContent+=data.text;if(type==='error')$('answer').textContent=data.message;if(type==='sources'){ $('sources').replaceChildren();for(const s of data.sources){let d=document.createElement('details');d.className='source';let label=document.createElement('summary');label.textContent=`[${s.id}] ${s.document} / ${s.section}`;let p=document.createElement('pre');p.textContent=s.text;d.append(label,p);$('sources').append(d)}}if(type==='done')$('state').textContent=`完成 / ${data.steps} 步 / ${data.elapsed_ms}ms`;}
$('send').onclick=async()=>{if(!$('q').value.trim())return;$('send').disabled=true;$('answer').textContent='';$('trace').textContent='';$('sources').replaceChildren();try{const r=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:$('q').value,session_id:session})});if(!r.ok)throw Error('HTTP '+r.status);const reader=r.body.getReader(),decoder=new TextDecoder();let pending='';while(true){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});let parts=pending.split('\n\n');pending=parts.pop();for(const block of parts){let type='',data='';for(const line of block.split('\n')){if(line.startsWith('event: '))type=line.slice(7);if(line.startsWith('data: '))data+=line.slice(6)}if(data)handle(type,JSON.parse(data))}if(done)break}}catch(e){$('answer').textContent='请求失败，请检查服务与配置。'}finally{$('send').disabled=false}};
</script></html>
